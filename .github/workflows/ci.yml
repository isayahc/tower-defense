name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OI_CHECKOUT: ${{ github.workspace }}/.integration/open-industries
    steps:
      - uses: actions/checkout@v4
      - name: Check out the verified SQLite runtime
        uses: actions/checkout@v4
        with:
          repository: Mapped-Assembly/Open-Industries
          ref: d34bf1f4921cd715abc5586352e7e44afbed0b51
          path: .integration/open-industries
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .integration/open-industries/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: .integration/open-industries
      - run: npm run check:materials
      - run: npm run check
      - run: npm run demo:science
      - run: npm run test:integration
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Verify victory, defeat and tie on desktop/mobile
        if: runner.os == 'Linux'
        run: npm run test:browser:results
      - name: Verify desktop and mobile browsers
        if: runner.os == 'Linux'
        run: npm run test:browser -- --combat
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: world-recovery-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
